<!DOCTYPE html>
<html lang="en">
  <head>
    <title>404 · MAUL</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="404 · MAUL" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://moddedamong.us/404.html" />
    <meta property="og:image" content="https://moddedamong.us/images/banner.png" />
    <meta property="og:description" content="That MAUL page could not be found." />
    <meta property="og:site_name" content="Modded Among Us Lobbies" />
    <meta property="og:locale" content="en_US" />

    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-pcKRe3h4c9VBPlPfwDrLEkHZ90a4q/OzHD7S9vMYI9z1y9u2c7p7x5AcZx/9H84zYZlzGw8c47jM7TCtWbsxkA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="/styles/navbar.css" />

    <style>
      :root {
        --accent: #ff4558;
        --accent-soft: rgba(255, 69, 88, 0.18);
        --accent-strong: #ff6f81;
        --warm: #ffcc80;
        --surface: rgba(14, 13, 16, 0.9);
        --surface-soft: rgba(24, 22, 26, 0.78);
        --text-main: #fffaf6;
        --text-muted: rgba(250, 240, 232, 0.7);
        --line: rgba(255, 204, 128, 0.17);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        position: relative;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.92) 72%),
          radial-gradient(circle at 18% 18%, rgba(198, 25, 47, 0.23), transparent 32%),
          radial-gradient(circle at 82% 15%, rgba(255, 204, 128, 0.1), transparent 25%),
          #050405;
        color: var(--text-main);
        font-family: "Roboto", sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background:
          linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 46px 46px;
        mask-image: linear-gradient(to bottom, black, transparent 78%);
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 115%, rgba(173, 12, 34, 0.18), transparent 42%),
          linear-gradient(90deg, rgba(0,0,0,0.5), transparent 20%, transparent 80%, rgba(0,0,0,0.5));
      }

      #navbar {
        --accent: #ff4558;
        --accent-soft: rgba(255, 69, 88, 0.18);
        --accent-strong: #ff6f81;
      }

      .page-shell {
        width: min(1180px, calc(100% - 40px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 108px 0 44px;
        display: grid;
        align-items: center;
      }

      .error-stage {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: 560px;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
        align-items: center;
        padding: clamp(34px, 6vw, 72px);
        border: 1px solid var(--line);
        border-radius: 12px;
        background:
          linear-gradient(135deg, rgba(25, 22, 25, 0.94), rgba(10, 9, 11, 0.97) 58%, rgba(30, 5, 10, 0.88)),
          var(--surface);
        box-shadow:
          0 36px 90px rgba(0, 0, 0, 0.64),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        animation: stageIn 0.7s ease-out both;
      }

      .error-stage::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          linear-gradient(115deg, rgba(255,255,255,0.07), transparent 24%),
          radial-gradient(circle at 77% 28%, rgba(255, 69, 88, 0.17), transparent 25%),
          radial-gradient(circle at 93% 80%, rgba(255, 204, 128, 0.07), transparent 28%);
        animation: glowDrift 10s ease-in-out infinite;
      }

      .starfield {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .sparkle {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        background: rgba(255, 248, 238, 0.92);
        box-shadow:
          0 0 7px rgba(255, 255, 255, 0.85),
          0 0 16px rgba(255, 204, 128, 0.35);
        opacity: 0.16;
        animation:
          sparkleTwinkle var(--twinkle, 3.4s) ease-in-out var(--delay, 0s) infinite,
          sparkleDrift var(--drift, 13s) ease-in-out var(--delay, 0s) infinite alternate;
      }

      .sparkle.cross {
        width: calc(var(--size) * 1.8);
        height: calc(var(--size) * 1.8);
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .sparkle.cross::before,
      .sparkle.cross::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(255, 248, 238, 0.95), transparent);
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.65));
      }

      .sparkle.cross::before {
        width: 100%;
        height: 1px;
      }

      .sparkle.cross::after {
        width: 1px;
        height: 100%;
        background: linear-gradient(180deg, transparent, rgba(255, 248, 238, 0.95), transparent);
      }

      .error-copy {
        position: relative;
        z-index: 2;
        min-width: 0;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        color: var(--warm);
        font-family: "Poppins", sans-serif;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 32px;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--warm));
        box-shadow: 0 0 16px rgba(255, 69, 88, 0.5);
      }

      .error-number-wrap {
        position: relative;
        width: clamp(19rem, 52vw, 39rem);
        aspect-ratio: 620 / 190;
        margin: 0 0 8px;
        isolation: isolate;
      }

      .error-number-solid,
      .error-number-outline {
        position: absolute;
        inset: 0 auto auto 0;
        display: block;
        width: clamp(19rem, 52vw, 39rem);
        height: auto;
        overflow: visible;
        user-select: none;
        pointer-events: none;
      }

      .error-number-solid {
        z-index: 1;
        transform: translate(12px, 14px);
                filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.45));
      }

      .error-number-solid text {
        fill: #4a0711;
      }

      .error-number-outline {
        z-index: 2;
        transform: translate(-5px, -7px);
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.10));
      }

      .error-number-outline text {
        fill: none;
        stroke: rgba(255, 255, 255, 0.9);
        stroke-width: 2.2;
        vector-effect: non-scaling-stroke;
        paint-order: stroke;
      }

      .error-number-wrap::after {
        content: "";
        position: absolute;
        left: 6%;
        right: -14%;
        bottom: -20px;
        z-index: 0;
        height: 54px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(116, 4, 20, 0.34), transparent 70%);
        filter: blur(10px);
              }


      h1 {
        max-width: 680px;
        margin: 32px 0 0;
        font-family: "Poppins", sans-serif;
        font-size: clamp(2rem, 4.1vw, 3.7rem);
        line-height: 1.04;
        letter-spacing: -0.045em;
      }

      .subtitle {
        max-width: 650px;
        margin: 18px 0 0;
        color: var(--text-muted);
        font-size: clamp(0.98rem, 1.5vw, 1.08rem);
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 30px;
      }

      .action {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 10px 16px;
        border: 1px solid rgba(255, 204, 128, 0.22);
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(22, 20, 23, 0.96), rgba(10, 10, 12, 0.96));
        color: #fff7ef;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      }

      .action:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 204, 128, 0.62);
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.42);
      }

      .action.primary {
        border-color: rgba(255, 95, 111, 0.5);
        background: linear-gradient(135deg, #d31c39, #870818 72%);
      }

      .action.primary:hover {
        border-color: rgba(255, 151, 161, 0.8);
        background: linear-gradient(135deg, #e22643, #9b0a1d 72%);
      }

      .action i {
        color: #ffd6b2;
      }

      .action.primary i {
        color: #ffffff;
      }

      .status-panel {
        position: relative;
        min-height: 350px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .orbit {
        position: absolute;
        width: min(34vw, 360px);
        aspect-ratio: 1;
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 50%;
        box-shadow:
          0 0 0 44px rgba(255,255,255,0.018),
          0 0 0 88px rgba(255,255,255,0.012);
        animation: orbitTurn 24s linear infinite;
      }

      .orbit::before,
      .orbit::after {
        content: "";
        position: absolute;
        border-radius: 50%;
      }

      .orbit::before {
        width: 11px;
        height: 11px;
        top: 12%;
        right: 16%;
        background: var(--accent);
        box-shadow: 0 0 24px rgba(255, 69, 88, 0.8);
      }

      .orbit::after {
        width: 6px;
        height: 6px;
        left: 7%;
        bottom: 25%;
        background: var(--warm);
        box-shadow: 0 0 18px rgba(255, 204, 128, 0.7);
      }

      .status-card {
        position: relative;
        z-index: 1;
        width: min(100%, 300px);
        padding: 24px;
        border: 1px solid rgba(255, 204, 128, 0.2);
        border-radius: 10px;
        background: rgba(9, 9, 11, 0.74);
        backdrop-filter: blur(14px);
        box-shadow:
          0 22px 54px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(255,255,255,0.05);
      }

      .status-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding-bottom: 18px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      .status-label {
        font-family: "Poppins", sans-serif;
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: rgba(250, 240, 232, 0.62);
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 16px rgba(255, 69, 88, 0.78);
        animation: statusPulse 2.3s ease-in-out infinite;
      }

      .status-card strong {
        display: block;
        margin-top: 20px;
        font-family: "Poppins", sans-serif;
        font-size: 1.34rem;
      }

      .status-card p {
        margin: 10px 0 0;
        color: var(--text-muted);
        font-size: 0.92rem;
        line-height: 1.55;
      }

      .mini-route {
        display: grid;
        gap: 9px;
        margin-top: 22px;
      }

      .mini-route span {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(250,240,232,0.7);
        font-size: 0.82rem;
      }

      .mini-route i {
        width: 16px;
        color: #f7d7ad;
        text-align: center;
      }

      .footer-note {
        margin: 18px 0 0;
        text-align: center;
        color: rgba(250, 240, 232, 0.48);
        font-size: 0.82rem;
      }

      @keyframes stageIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes glowDrift {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        50% { transform: translate3d(18px, -10px, 0) scale(1.05); }
      }

      @keyframes sparkleTwinkle {
        0%, 100% { opacity: 0.12; transform: scale(0.72); }
        45% { opacity: 0.92; transform: scale(1.14); }
        60% { opacity: 0.34; transform: scale(0.92); }
      }

      @keyframes sparkleDrift {
        from { margin-top: 0; margin-left: 0; }
        to { margin-top: -10px; margin-left: 7px; }
      }

      @media (max-width: 820px) {
        .page-shell {
          width: min(100% - 28px, 1180px);
          padding-top: 92px;
        }

        .error-stage {
          min-height: auto;
          grid-template-columns: 1fr;
          gap: 24px;
          padding: 34px 24px;
        }

        .status-panel {
          min-height: 280px;
          order: -1;
        }

        .orbit {
          width: min(72vw, 310px);
        }
      }

      @media (max-width: 520px) {
        .page-shell {
          width: min(100% - 22px, 1180px);
          padding-top: 84px;
        }

        .error-stage {
          padding: 28px 18px;
          border-radius: 10px;
        }

        .error-number-solid,
        .error-number-outline {
          font-size: clamp(5.2rem, 30vw, 8rem);
        }

        h1 {
          margin-top: 26px;
        }

        .actions {
          flex-direction: column;
        }

        .action {
          width: 100%;
        }

        .status-panel {
          min-height: 245px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="navbar"></div>

    <main class="page-shell">
      <section class="error-stage" aria-labelledby="error-title">
        <div class="starfield" aria-hidden="true">
          <span class="sparkle cross" style="--x: 76%; --y: 15%; --size: 8px; --delay: -0.7s; --twinkle: 3.2s; --drift: 14s;"></span>
          <span class="sparkle" style="--x: 88%; --y: 24%; --size: 3px; --delay: -2.1s; --twinkle: 4.2s; --drift: 17s;"></span>
          <span class="sparkle" style="--x: 69%; --y: 31%; --size: 4px; --delay: -1.2s; --twinkle: 3.8s; --drift: 15s;"></span>
          <span class="sparkle cross" style="--x: 93%; --y: 39%; --size: 6px; --delay: -2.8s; --twinkle: 4.8s; --drift: 18s;"></span>
          <span class="sparkle" style="--x: 82%; --y: 52%; --size: 2px; --delay: -1.6s; --twinkle: 3.1s; --drift: 13s;"></span>
          <span class="sparkle" style="--x: 73%; --y: 64%; --size: 3px; --delay: -3.2s; --twinkle: 4.4s; --drift: 19s;"></span>
          <span class="sparkle cross" style="--x: 91%; --y: 72%; --size: 7px; --delay: -0.2s; --twinkle: 3.9s; --drift: 16s;"></span>
          <span class="sparkle" style="--x: 64%; --y: 80%; --size: 2px; --delay: -2.4s; --twinkle: 5.1s; --drift: 20s;"></span>
          <span class="sparkle" style="--x: 55%; --y: 13%; --size: 2px; --delay: -0.9s; --twinkle: 4.6s; --drift: 18s;"></span>
          <span class="sparkle" style="--x: 47%; --y: 22%; --size: 3px; --delay: -3.0s; --twinkle: 3.6s; --drift: 15s;"></span>
          <span class="sparkle cross" style="--x: 58%; --y: 43%; --size: 5px; --delay: -1.8s; --twinkle: 4.1s; --drift: 17s;"></span>
          <span class="sparkle" style="--x: 39%; --y: 72%; --size: 2px; --delay: -2.6s; --twinkle: 4.9s; --drift: 21s;"></span>
          <span class="sparkle" style="--x: 24%; --y: 12%; --size: 2px; --delay: -1.1s; --twinkle: 5.4s; --drift: 18s;"></span>
          <span class="sparkle" style="--x: 13%; --y: 82%; --size: 3px; --delay: -3.4s; --twinkle: 4.3s; --drift: 16s;"></span>
        </div>
        <div class="error-copy">
          <div class="eyebrow">Navigation error</div>
          <div class="error-number-wrap" aria-hidden="true">
            <svg class="error-number-solid" viewBox="0 0 620 190" aria-hidden="true" focusable="false">
              <text x="0" y="150" font-family="Poppins, sans-serif" font-size="190" font-weight="800" letter-spacing="-15">404</text>
            </svg>
            <svg class="error-number-outline" viewBox="0 0 620 190" aria-hidden="true" focusable="false">
              <text x="0" y="150" font-family="Poppins, sans-serif" font-size="190" font-weight="800" letter-spacing="-15">404</text>
            </svg>
          </div>

          <h1 id="error-title">Looks like this page left the lobby.</h1>
          <p class="subtitle">
            The address may be outdated, the page may have moved, or the link may have been entered incorrectly.
            You can head back to MAUL or return to the page you were just on.
          </p>

          <div class="actions">
            <a class="action primary" href="https://moddedamong.us/">
              <i class="fa-solid fa-house" aria-hidden="true"></i>
              Back to Home
            </a>
            <a class="action" href="javascript:history.back()">
              <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
              Go Back
            </a>
            <a class="action" href="https://discord.gg/maul" target="_blank" rel="noopener noreferrer">
              <i class="fa-brands fa-discord" aria-hidden="true"></i>
              Join MAUL
            </a>
          </div>
        </div>


      </section>

      <div class="footer-note">Modded Among Us Lobbies · Error 404</div>
    </main>
    <script src="/scripts/navbar.js"></script>
  </body>
</html>
